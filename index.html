<!DOCTYPE html>
<html lang="zh-CN">

<title>新品数据追踪看板</title>

        font-size:13px;color:#1f2937;background:#fff;outline:none;min-width:150px}

  .quick{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
  .quick button{padding:7px 14px;border:1px solid #d9dee8;background:#fff;border-radius:8px;
        cursor:pointer;font-size:12.5px;color:#475467;transition:.15s}
  .quick button:hover{border-color:#4f46e5;color:#4f46e5;background:#f5f6ff}
  .quick button.on{background:#4f46e5;border-color:#4f46e5;color:#fff}

  .products{display:flex;gap:16px;align-items:stretch}
  .prod{flex:1;display:flex;gap:14px;align-items:flex-start;padding:12px 14px;border-radius:12px;
        border:1px solid #eef1f8;min-width:0}
  .prod.cur{background:linear-gradient(135deg,#f5f6ff,#fbfbff);border-color:#e0e4ff}
  .prod.cmp{background:linear-gradient(135deg,#fffaef,#fffdf8);border-color:#fde9c8}
  .prod-img{width:80px;height:80px;border-radius:10px;overflow:hidden;flex-shrink:0;background:#fff;
        display:flex;align-items:center;justify-content:center;border:1px solid #eaecf0;margin-top:4px}
  .prod-img img{width:100%;height:100%;object-fit:cover;display:block}
  .prod-img svg{width:100%;height:100%;display:block}
  .prod-info{min-width:0;flex:1}
  .prod-title{font-size:12.5px;color:#475467;line-height:1.5;margin-top:7px;

  .vs{align-self:center;font-weight:800;color:#c0c6d4;font-size:13px;letter-spacing:1px;flex-shrink:0}
  @media(max-width:820px){.products{flex-direction:column}.vs{display:none}}

  .pid-input{flex:1;min-width:0;padding:6px 10px;border:1px solid #d9dee8;border-radius:8px;
        font-size:12.5px;font-weight:600;color:#1f2937;background:#fff;outline:none;

  .combo-btn:hover{border-color:#4f46e5;color:#4f46e5;background:#f8f9ff}

  .combo-opt:hover,.combo-opt.active{background:#f5f6ff}
  .combo-opt.sel{background:#eef2ff}
  .opt-txt{flex:1;min-width:0}
  .opt-id{font-size:12px;font-weight:700;color:#1f2937;font-variant-numeric:tabular-nums}

  .opt-img svg{width:100%;height:100%;display:block}
  .opt-empty{padding:14px;text-align:center;color:#98a2b3;font-size:12px}

  table.tbl th{background:#f8fafc;color:#667085;font-weight:600;text-align:right;
        padding:9px 10px;border-bottom:1px solid #eaecf0;white-space:nowrap}

  .badge.cmp{background:#f59e0b;color:#fff}

  .down{color:#e5484d;font-weight:600}
  .muted{color:#c0c6d4}

  .chart-dot{position:absolute;width:8px;height:8px;border-radius:50%;background:#fff;

        transition:opacity .12s;transform:translate(-50%,-50%);z-index:6;box-shadow:0 0 0 3px rgba(255,255,255,.85)}

        opacity:0;transition:opacity .12s;white-space:nowrap;z-index:20;

  .sticky thead th{position:sticky;top:0;z-index:2}
  .scroll{max-height:520px;overflow:auto;border-radius:10px}

const fmtInt   = v => (v || 0).toLocaleString('zh-CN');

const fmtMoney = v => '¥' + (v || 0).toLocaleString('zh-CN', {minimumFractionDigits:2, maximumFractionDigits:2});

function fmtDate(d){
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), dd = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}
function addDays(dstr, n){
  const [y,m,d] = dstr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate() + n);
  return fmtDate(dt);
}
function dateRange(a, b){
  const out = [], cur = new Date(a + 'T00:00:00'), end = new Date(b + 'T00:00:00');
  while (cur <= end) { out.push(fmtDate(cur)); cur.setDate(cur.getDate() + 1); }
  return out;
}

/* 单行衍生值 */
const rowGMV  = r => r.cost > 0 ? r.cost * (r.roi || 0) : 0;
const rowCartRate = r => r.uv ? r.cart / r.uv : 0;
const rowPayRate  = r => r.uv ? r.payer / r.uv : 0;
const rowCartCost = r => (r.cost > 0 && r.cart > 0) ? r.cost / r.cart : null;

/* 聚合 */
function aggregate(rows){
  const a = {pv:0, uv:0, cart:0, payer:0, cost:0, gmv:0, days:0};
  rows.forEach(r => {
    a.pv += r.pv; a.uv += r.uv; a.cart += r.cart; a.payer += r.payer;
    a.cost += r.cost; a.gmv += rowGMV(r); a.days++;
  });
  a.cartRate = a.uv ? a.cart / a.uv : 0;
  a.payRate  = a.uv ? a.payer / a.uv : 0;
  a.cartCost = (a.cost > 0 && a.cart > 0) ? a.cost / a.cart : null;
  a.roi      = a.cost > 0 ? a.gmv / a.cost : null;
  return a;
}

function rowsOf(id){
  return RAW.filter(r => r.id === id && r.d >= state.start && r.d <= state.end);
}

/* ========================= 商品图片 ========================= */
function imgSrcOf(id){
  return PRODUCT_IMAGES[id] || `images/${id}.jpg`;
}

function placeholderSVG(id){
  const hue = [...String(id)].reduce((s,c)=>s + c.charCodeAt(0), 0) % 360;
  const c1 = `hsl(${hue},72%,89%)`;
  const c2 = `hsl(${(hue + 42) % 360},66%,77%)`;
  const label = PRODUCTS[id] ? PRODUCTS[id].charAt(0) : '品';
  const gid = 'g' + String(id).replace(/\W/g,'');
  return `<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/>
    </linearGradient></defs>
    <rect width="80" height="80" fill="url(#${gid})"/>
    <text x="40" y="49" text-anchor="middle" font-size="30" font-weight="700"
      fill="#ffffff" opacity=".95"
      font-family="PingFang SC,Microsoft YaHei,sans-serif">${label}</text>
  </svg>`;
}

function loadImgInto(container, id){
  if (!container || !id) return;
  const fallback = () => { container.innerHTML = placeholderSVG(id); };
  const img = new Image();
  img.alt = PRODUCTS[id] || id;
  img.title = PRODUCTS[id] || id;
  img.onload  = () => { container.innerHTML = ''; container.appendChild(img); };
  img.onerror = fallback;
  img.src = imgSrcOf(id);
  if (img.complete && img.naturalWidth > 0){
    container.innerHTML = '';
    container.appendChild(img);
  }
}

/* ========================= 商品卡（下拉 + 搜索 + 输入 ID） ========================= */
function renderProdCard(elId, id, role, cls){
  const el = document.getElementById(elId);
  if (!el) return;
  const title = PRODUCTS[id] || '未收录该商品，仅显示已有数据';

  el.innerHTML = `
    <div class="prod-img" id="img-${elId}"></div>
    <div class="prod-info">
      <span class="badge ${cls}">${role}</span>
      <div class="combo">
        <input class="pid-input" id="inp-${elId}" type="text" inputmode="numeric"
               value="${id}" placeholder="搜索名称 / 输入ID" spellcheck="false" autocomplete="off">
        <button class="combo-btn" type="button" id="btn-${elId}" aria-label="展开商品列表">▼</button>
        <div class="combo-panel" id="panel-${elId}"></div>
      </div>
      <div class="prod-title" title="${title}">${title}</div>
    </div>`;

  loadImgInto(document.getElementById('img-' + elId), id);
  bindCombo(elId);
}

function bindCombo(elId){
  const key    = elId === 'prodCur' ? 'pid' : 'cmpId';
  const inp    = document.getElementById('inp-' + elId);
  const btn    = document.getElementById('btn-' + elId);
  const panel  = document.getElementById('panel-' + elId);
  if (!inp || !btn || !panel) return;

  let isOpen = false, activeIdx = -1;

  /* 生成列表（支持按 ID / 名称过滤） */
  function buildList(kw){
    const q = (kw || '').trim();
    const isIdLike = /^\d+$/.test(q);
    const ids = Object.keys(PRODUCTS).filter(pid => {
      if (!q) return true;
      if (isIdLike) return pid.includes(q);
      return (PRODUCTS[pid] || '').includes(q);
    });

    if (!ids.length){
      panel.innerHTML = '<div class="opt-empty">无匹配商品，可直接输入 ID 后回车</div>';
      activeIdx = -1;
      return;
    }

    panel.innerHTML = ids.map(pid => `
      <div class="combo-opt${pid === state[key] ? ' sel' : ''}" data-id="${pid}">
        <span class="opt-txt">
          <div class="opt-id">${pid}</div>
          <div class="opt-name">${PRODUCTS[pid] || ''}</div>
        </span>
        <span class="opt-img" data-img="${pid}"></span>
      </div>`).join('');

    panel.querySelectorAll('.opt-img').forEach(node => loadImgInto(node, node.dataset.img));
    activeIdx = -1;
  }

  function openPanel(){
    if (isOpen) return;
    isOpen = true;
    panel.classList.add('open');
    buildList(inp.value);
  }
  function closePanel(){
    isOpen = false;
    activeIdx = -1;
    panel.classList.remove('open');
  }
  function pick(pid){
    closePanel();
    if (pid === state[key]){ inp.value = pid; return; }
    state[key] = pid;
    render();
  }
  function commitInput(){
    const v = inp.value.trim();
    if (!/^\d{6,}$/.test(v)){ inp.value = state[key]; return; }
    if (v === state[key]) return;
    state[key] = v;
    render();
  }

  /* 按钮：阻止失焦，切换面板 */
  btn.addEventListener('mousedown', e => e.preventDefault());
  btn.addEventListener('click', () => {
    if (isOpen){ closePanel(); }
    else { openPanel(); inp.focus(); }
  });

  /* 输入时过滤 */
  inp.addEventListener('input', () => {
    if (!isOpen) openPanel();
    else buildList(inp.value);
  });

  /* 键盘操作 */
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter'){
      e.preventDefault();
      if (isOpen){
        const opts = [...panel.querySelectorAll('.combo-opt')];
        if (activeIdx >= 0 && opts[activeIdx]){
          pick(opts[activeIdx].dataset.id);
          return;
        }
      }
      closePanel();
      commitInput();
      return;
    }
    if (e.key === 'Escape'){
      closePanel();
      inp.value = state[key];
      inp.blur();
      return;
    }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      if (!isOpen) openPanel();
      const opts = [...panel.querySelectorAll('.combo-opt')];
      if (!opts.length) return;
      e.preventDefault();
      activeIdx = e.key === 'ArrowDown'
        ? Math.min(opts.length - 1, activeIdx + 1)
        : Math.max(0, activeIdx - 1);
      opts.forEach((o, i) => o.classList.toggle('active', i === activeIdx));
      opts[activeIdx].scrollIntoView({block: 'nearest'});
    }
  });

  /* 失焦：关闭面板并提交输入 */
  inp.addEventListener('blur', () => {
    setTimeout(() => {
      if (!document.body.contains(inp)) return;
      closePanel();
      commitInput();
    }, 120);
  });

  /* 面板内点击选择（mousedown 阻止失焦） */
  panel.addEventListener('mousedown', e => {
    if (e.target.closest('.combo-opt')) e.preventDefault();
  });
  panel.addEventListener('click', e => {
    const opt = e.target.closest('.combo-opt');
    if (!opt) return;
    pick(opt.dataset.id);
  });
}

function renderProducts(){
  renderProdCard('prodCur', state.pid,   '当前商品', 'cur');
  renderProdCard('prodCmp', state.cmpId, '对比品',   'cmp');
}

/* ========================= 图表（含 hover 提示） ========================= */
function niceStep(x){
  if (x <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(x)));
  const n = x / p;
  let m;
  if (n <= 1) m = 1; else if (n <= 2) m = 2; else if (n <= 2.5) m = 2.5;
  else if (n <= 5) m = 5; else m = 10;
  return m * p;
}

function chartEmpty(el){
  el.innerHTML = '<div class="empty">该区间暂无数据</div>';
  el._meta = null;
}

function drawChart(el, cfg){
  if (!el) return;
  const W = Math.max(el.clientWidth || 560, 300);
  const H = cfg.height || 250;
  const pad = {t: 20, r: 18, b: 34, l: 58};
  const iw = W - pad.l - pad.r;
  const ih = H - pad.t - pad.b;
  const labels = cfg.labels, n = labels.length, series = cfg.series;

  if (n === 0){ chartEmpty(el); return; }

  let rawMax = 0;
  series.forEach(s => s.data.forEach(v => { if (v > rawMax) rawMax = v; }));
  if (rawMax <= 0) rawMax = 1;

  const step = niceStep(rawMax / 4);
  const maxV = Math.ceil(rawMax / step) * step;
  const gridCount = Math.max(1, Math.round(maxV / step));

  const yOf = v => pad.t + ih - (v / maxV) * ih;
  const xOf = i => {
    if (cfg.type === 'bar') return pad.l + (i + 0.5) * (iw / n);
    return n === 1 ? pad.l + iw / 2 : pad.l + (i * iw) / (n - 1);
  };

  let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif">`;

  for (let i = 0; i <= gridCount; i++){
    const v = i * step, yy = yOf(v);
    svg += `<line x1="${pad.l}" y1="${yy}" x2="${pad.l + iw}" y2="${yy}" stroke="#eef1f6"/>`;
    svg += `<text x="${pad.l - 9}" y="${yy + 4}" text-anchor="end" font-size="10.5" fill="#98a2b3">${cfg.fmtY ? cfg.fmtY(v) : Math.round(v)}</text>`;
  }
  svg += `<line x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${pad.t + ih}" stroke="#d9dee8"/>`;
  svg += `<line x1="${pad.l}" y1="${pad.t + ih}" x2="${pad.l + iw}" y2="${pad.t + ih}" stroke="#d9dee8"/>`;

  const skip = Math.max(1, Math.ceil(n / 9));
  labels.forEach((lb, i) => {
    if (i % skip !== 0 && i !== n - 1) return;
    svg += `<text x="${xOf(i)}" y="${H - 12}" text-anchor="middle" font-size="10" fill="#98a2b3">${lb.slice(5)}</text>`;
  });

  series.forEach((s, si) => {
    if (cfg.type === 'bar'){
      const bw = Math.max(4, Math.min(16, (iw / n) / (series.length + 1.4)));
      const gap = 3;
      const groupW = bw * series.length + gap * (series.length - 1);
      s.data.forEach((v, i) => {
        const cx = xOf(i);
        const x = cx - groupW / 2 + si * (bw + gap);
        const y = yOf(v);
        const h = pad.t + ih - y;
        if (h > 0.5) svg += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${s.color}" rx="2"/>`;
      });
    } else {
      const pts = s.data.map((v, i) => `${xOf(i).toFixed(1)},${yOf(v).toFixed(1)}`).join(' ');
      if (n > 1) svg += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.2"
        stroke-linejoin="round" stroke-linecap="round" ${s.dash ? 'stroke-dasharray="5 4"' : ''}/>`;
      s.data.forEach((v, i) => {
        svg += `<circle cx="${xOf(i).toFixed(1)}" cy="${yOf(v).toFixed(1)}" r="2.6" fill="#fff" stroke="${s.color}" stroke-width="2"/>`;
      });
    }
  });

  svg += `</svg>`;

  let overlay = '<div class="chart-guide"></div><div class="chart-tip"></div>';
  series.forEach((s, i) => { overlay += `<div class="chart-dot" data-i="${i}"></div>`; });

  el.innerHTML = svg + overlay;
  el._meta = {n, xOf, yOf, labels, series, pad, W, H, iw, ih, fmtY: cfg.fmtY, type: cfg.type};

  if (!el._bound){
    el._bound = true;
    el.addEventListener('mousemove', e => onChartMove(el, e));
    el.addEventListener('mouseleave', () => onChartLeave(el));
  }
}

function onChartMove(el, e){
  const m = el._meta;
  if (!m || !m.n){ onChartLeave(el); return; }

  const rect = el.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  if (mx < m.pad.l - 12 || mx > m.pad.l + m.iw + 12 || my < 0 || my > m.H){
    onChartLeave(el); return;
  }

  let idx = 0, best = Infinity;
  for (let i = 0; i < m.n; i++){
    const d = Math.abs(m.xOf(i) - mx);
    if (d < best){ best = d; idx = i; }
  }

  const x = m.xOf(idx);

  const guide = el.querySelector('.chart-guide');
  if (guide){
    guide.style.left = x + 'px';
    guide.style.top = m.pad.t + 'px';
    guide.style.height = m.ih + 'px';
    guide.style.opacity = 1;
  }

  const dots = el.querySelectorAll('.chart-dot');
  m.series.forEach((s, i) => {
    const dot = dots[i];
    if (!dot) return;
    const v = s.data[idx] || 0;
    dot.style.left = x + 'px';
    dot.style.top  = m.yOf(v) + 'px';
    dot.style.borderColor = s.color;
    dot.style.opacity = 1;
  });

  const tip = el.querySelector('.chart-tip');
  if (tip){
    let html = `<div class="t">${m.labels[idx]}</div>`;
    m.series.forEach(s => {
      const v = s.data[idx] || 0;
      html += `<div class="r"><span><i style="background:${s.color}"></i>${s.name}</span><b>${m.fmtY ? m.fmtY(v) : v}</b></div>`;
    });
    tip.innerHTML = html;
    tip.classList.add('show');

    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let left = mx + 16;
    if (left + tw > m.W - 6) left = mx - tw - 16;
    left = Math.max(6, Math.min(left, m.W - tw - 6));

    let top = my - th - 12;
    if (top < 4) top = my + 20;
    top = Math.max(4, Math.min(top, m.H - th - 4));

    tip.style.left = left + 'px';
    tip.style.top  = top + 'px';
  }
}

function onChartLeave(el){
  const guide = el.querySelector('.chart-guide');
  if (guide) guide.style.opacity = 0;
  el.querySelectorAll('.chart-dot').forEach(d => d.style.opacity = 0);
  const tip = el.querySelector('.chart-tip');
  if (tip) tip.classList.remove('show');
}

function legend(el, items){
  el.innerHTML = items.map(it => `<span><i style="background:${it.color}"></i>${it.name}</span>`).join('');
}

function renderDiffTable(){
  const cur = aggregate(rowsOf(state.pid));
  const cmp = aggregate(rowsOf(state.cmpId));

  const items = [
    {name:'浏览量',       c:cur.pv,       b:cmp.pv,       f:fmtInt,   good:'up'},
    {name:'访客数',       c:cur.uv,       b:cmp.uv,       f:fmtInt,   good:'up'},
    {name:'加购人数',     c:cur.cart,     b:cmp.cart,     f:fmtInt,   good:'up'},
    {name:'加购率',       c:cur.cartRate, b:cmp.cartRate, f:fmtPct,   good:'up'},
    {name:'支付买家数',   c:cur.payer,    b:cmp.payer,    f:fmtInt,   good:'up'},
    {name:'支付转化率',   c:cur.payRate,  b:cmp.payRate,  f:fmtPct,   good:'up'},
    {name:'推广消耗',     c:cur.cost,     b:cmp.cost,     f:fmtMoney, good:'down'},
    {name:'推广成交金额', c:cur.gmv,      b:cmp.gmv,      f:fmtMoney, good:'up'},
    {name:'加购成本',     c:cur.cartCost, b:cmp.cartCost, f:fmtCost,  good:'down'}
  ];

  let html = `<thead><tr>
    <th class="l">指标</th><th>当前商品 ${state.pid}</th><th>对比品 ${state.cmpId}</th>
    <th>差异</th><th>差异率</th><th class="l">判断</th>
  </tr></thead><tbody>`;

  items.forEach(it => {
    const hasC = cur.days > 0 && it.c !== null && isFinite(it.c);
    const hasB = cmp.days > 0 && it.b !== null && isFinite(it.b) && it.b !== 0;
    const diff = (hasC && hasB) ? it.c - it.b : null;
    const rate = (hasC && hasB) ? (it.c / it.b - 1) : null;

    let judge = '<span class="muted">—</span>';
    if (rate !== null && Math.abs(rate) >= 0.05){
      const better = it.good === 'up' ? rate > 0 : rate < 0;
      judge = better ? '<span class="up">▲ 优于对比品</span>' : '<span class="down">▼ 弱于对比品</span>';
    } else if (rate !== null){
      judge = '<span class="muted">≈ 基本持平</span>';
    }

    const diffTxt = diff === null ? '<span class="muted">—</span>'
      : (it.f === fmtInt ? (diff >= 0 ? '+' : '') + Math.round(diff).toLocaleString('zh-CN')
        : it.f === fmtPct ? (diff >= 0 ? '+' : '') + (diff * 100).toFixed(2) + 'pp'
        : (diff >= 0 ? '+' : '-') + '¥' + Math.abs(diff).toFixed(2));
    const rateTxt = rate === null ? '<span class="muted">—</span>'
      : `<span class="${rate >= 0 ? 'up' : 'down'}">${(rate >= 0 ? '+' : '') + (rate * 100).toFixed(1)}%</span>`;

    html += `<tr>
      <td class="l">${it.name}</td>
      <td>${hasC ? it.f(it.c) : '<span class="muted">—</span>'}</td>
      <td>${hasB ? it.f(it.b) : '<span class="muted">—</span>'}</td>
      <td>${diffTxt}</td>
      <td>${rateTxt}</td>
      <td class="l">${judge}</td>
    </tr>`;
  });

  html += '</tbody>';
  document.getElementById('diffTable').innerHTML = html;
}

      {name:'当前商品', color:C_CUR, data:pick(curMap,'cartRate')},

  });

  legend(document.getElementById('lg3'), [
    {name:'当前商品', color:C_CUR}, {name:'对比品', color:C_CMP}
  ]);
  drawChart(document.getElementById('chart3'), {
    labels, type:'bar',
    series:[
      {name:'当前商品', color:C_CUR, data:pick(curMap,'cost')},
      {name:'对比品',   color:C_CMP, data:pick(cmpMap,'cost')}

    fmtY: v => '¥' + Math.round(v).toLocaleString('zh-CN')
  });

  legend(document.getElementById('lg4'), [
    {name:'当前商品', color:C_CUR}, {name:'对比品', color:C_CMP}
  ]);
  drawChart(document.getElementById('chart4'), {
    labels, type:'line',
    series:[

    ],
    fmtY: v => (v * 100).toFixed(1) + '%'

/* ========================= 初始化 ========================= */
function init(){
  const si = document.getElementById('startDate');
  const ei = document.getElementById('endDate');
  [si, ei].forEach(el => { el.min = MIN_DATE; el.max = MAX_DATE; });
  si.value = state.start;
  ei.value = state.end;

  si.addEventListener('change', () => {
    if (!si.value) return;
    state.start = si.value > state.end ? state.end : si.value;
    si.value = state.start;
    markQuick(null);
    render();
  });
  ei.addEventListener('change', () => {
    if (!ei.value) return;
    state.end = ei.value < state.start ? state.start : ei.value;
    ei.value = state.end;
    markQuick(null);
    render();
  });

  document.querySelectorAll('.quick button').forEach(btn => {
    btn.addEventListener('click', () => {
      const days = Number(btn.dataset.days);
      if (days === 0){
        state.start = MIN_DATE; state.end = MAX_DATE;
      } else {
        state.start = addDays(MAX_DATE, -(days - 1));
        if (state.start < MIN_DATE) state.start = MIN_DATE;
        state.end = MAX_DATE;
      }
      si.value = state.start;
      ei.value = state.end;
      markQuick(btn);
      render();
    });
  });

  let t = null;
  window.addEventListener('resize', () => {
    clearTimeout(t);
    t = setTimeout(renderCharts, 160);
  });

  render();
}

function markQuick(activeBtn){
  document.querySelectorAll('.quick button').forEach(b => b.classList.remove('on'));
  if (activeBtn) activeBtn.classList.add('on');
}

init();
</script>
</body>
</html>
